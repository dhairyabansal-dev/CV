name: Temporary dependency security refresh

on:
  push:
    branches:
      - feat/professional-services-portal
    paths:
      - ".github/workflows/dependency-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    name: Patch vulnerable production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dhairya-portfolio
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/professional-services-portal

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dhairya-portfolio/package-lock.json

      - name: Upgrade patched Next.js release
        run: npm install --save-exact next@16.4.6 eslint-config-next@16.4.6

      - name: Pin patched PostCSS selector parser
        run: |
          npm pkg set 'overrides.postcss-selector-parser=^6.1.5'
          npm install

      - name: Apply compatible transitive security fixes
        run: npm audit fix || echo "Some non-production advisories may remain; production audit is enforced next."

      - name: Enforce production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Verify lint
        run: npm run lint

      - name: Verify production build
        run: npm run build

      - name: Commit package manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore: patch Next.js security vulnerabilities"
          git push origin HEAD:feat/professional-services-portal
