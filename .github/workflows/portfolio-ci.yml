name: Portfolio CI

on:
  pull_request:
    branches: [main]
    paths:
      - "dhairya-portfolio/**"
      - ".github/workflows/portfolio-ci.yml"
  push:
    branches:
      - main
      - feat/professional-services-portal
    paths:
      - "dhairya-portfolio/**"
      - ".github/workflows/portfolio-ci.yml"

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dhairya-portfolio
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dhairya-portfolio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Run ESLint
        run: npm run lint

      - name: Run Next.js production build
        run: npm run build
